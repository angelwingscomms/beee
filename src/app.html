<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0A0F1A" />
		<!-- Preload the two fonts that paint the LCP text (hero + body). -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/fraunces/fraunces-latin-normal.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/sn-pro/sn-pro-latin-400-normal.woff2"
			crossorigin
		/>
		<meta name="theme-color" content="#0A0F1A" />
		<meta name="format-detection" content="telephone=no" />
		<!-- Preload the two fonts that paint the LCP text (hero + body). -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/fraunces/fraunces-latin-normal.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/sn-pro/sn-pro-latin-400-normal.woff2"
			crossorigin
		/>
		<script>
			(function() {
				try {
					document.documentElement.classList.add('dark');
				} catch(e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
